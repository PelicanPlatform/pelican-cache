{{- if .Values.certificate.enabled }}
{{- $dnsNames := concat (list (required "serverHostname is required" .Values.serverHostname)) (.Values.certificate.dnsNames | default (list)) | uniq }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "pelican-cache.fullname" . }}-cert
  labels:
    {{- include "pelican-cache.labels" . | nindent 4 }}
spec:
  dnsNames:
    {{- toYaml $dnsNames | nindent 4 }}
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
  secretName: {{ include "pelican-cache.fullname" . }}-tls
{{- end }}
