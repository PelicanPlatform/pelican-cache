apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pelican-cache.fullname" . }}
  labels:
    {{- include "pelican-cache.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pelican-cache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/pelican-config: {{ include (print $.Template.BasePath "/configmap-pelican.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pelican-cache.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      hostNetwork: {{ .Values.hostNetwork }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # ---- Main Pelican cache container ----
        - name: pelican-cache
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if .Values.sleep }}
          command: ["sleep", "infinity"]
          {{- else }}
          args: []
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.cache.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.extraEnv }}
          env:
            {{- toYaml .Values.extraEnv | nindent 12 }}
          {{- end }}
          ports:
            - name: pelican
              containerPort: {{ .Values.server.cachePort }}
              protocol: TCP
            - name: pelican-webui
              containerPort: {{ .Values.server.webPort }}
              protocol: TCP
          volumeMounts:
            - name: pelican-config
              mountPath: /etc/pelican/config.d/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /cache
            {{- if .Values.logging.persistence.separateVolume }}
            - name: logging-volume
              mountPath: /var/log/pelican
            {{- else }}
            - name: data
              mountPath: /var/log
            {{- end }}
            - name: issuer-key
              readOnly: true
              mountPath: /etc/pelican/issuer-keys/issuer.pem
              subPath: {{ .Values.issuerKey.secretKey }}
            - name: tls-cert
{{/* We cannot mount the host cert secret at /etc/pelican/certificates
because that would make that directory read-only and Pelican needs to write
its own CA there.  So we use a different directory here and in the Pelican config.
*/}}
              mountPath: /etc/pelican/cert-orig
            {{- if .Values.lotman.enabled }}
            - name: lotman-data
              mountPath: /var/lib/pelican/lotman
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: oidc-credentials
              mountPath: /etc/pelican/oidc/client.id
              subPath: client.id
              readOnly: true
            - name: oidc-credentials
              mountPath: /etc/pelican/oidc/client.secret
              subPath: client.secret
              readOnly: true
            {{- end }}
            {{- if .Values.webPassword.existingSecret }}
            - name: web-passwd
              readOnly: true
              mountPath: /etc/pelican/server-web-passwd
              subPath: {{ .Values.webPassword.key | default "server-web-passwd" }}
            {{- end }}
            {{- if .Values.xrootd.extraConfig }}
            - name: xrootd-config
              mountPath: /etc/pelican/xrootd.conf
              subPath: xrootd.conf
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        # ---- Logrotate sidecar ----
        - name: logrotate
          image: "{{ .Values.logrotate.image.repository }}:{{ .Values.logrotate.image.tag }}"
          imagePullPolicy: Always
          {{- with .Values.logrotate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.logging.persistence.separateVolume }}
            - name: logging-volume
              mountPath: /var/log/pelican
            {{- else }}
            - name: data
              mountPath: /var/log
            {{- end }}
            - name: log-rotate-config
              mountPath: /etc/logrotate.d/

      volumes:
        # TLS certificate (from cert-manager or existing Secret)
        - name: tls-cert
          secret:
            secretName: {{ include "pelican-cache.tlsSecretName" . }}
            items:
              - key: tls.crt
                path: tls.crt
                mode: 0644
              - key: tls.key
                path: tls.key
                mode: 0600

        # Pelican configuration
        - name: pelican-config
          configMap:
            name: {{ include "pelican-cache.fullname" . }}-pelican-config
            items:
              - key: config.yaml
                path: config.yaml
                mode: 0644

        # Logrotate configuration
        - name: log-rotate-config
          configMap:
            name: {{ include "pelican-cache.fullname" . }}-logrotate

        # Cache data volume (PVC or hostPath)
        {{- if eq .Values.cache.type "pvc" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ if .Values.cache.pvc.existingClaim }}{{ .Values.cache.pvc.existingClaim }}{{ else }}{{ include "pelican-cache.fullname" . }}-data{{ end }}
        {{- else }}
        - name: data
          hostPath:
            path: {{ required "cache.hostPath.path is required when cache.type is hostPath" .Values.cache.hostPath.path }}
            type: Directory
        {{- end }}

        # Logging volume
        {{- if .Values.logging.persistence.separateVolume }}
        - name: logging-volume
          persistentVolumeClaim:
            claimName: {{ if .Values.logging.persistence.existingClaim }}{{ .Values.logging.persistence.existingClaim }}{{ else }}{{ include "pelican-cache.fullname" . }}-logging{{ end }}
        {{- end }}

        # Issuer key
        - name: issuer-key
          secret:
            secretName: {{ required "issuerKey.existingSecret is required" .Values.issuerKey.existingSecret }}
            items:
              - key: {{ .Values.issuerKey.secretKey }}
                path: {{ .Values.issuerKey.secretKey }}
                mode: 0600

        {{- if .Values.lotman.enabled }}
        # Lotman persistent data
        - name: lotman-data
          persistentVolumeClaim:
            claimName: {{ if .Values.lotman.pvc.existingClaim }}{{ .Values.lotman.pvc.existingClaim }}{{ else }}{{ include "pelican-cache.fullname" . }}-lotman{{ end }}
        {{- end }}

        {{- if .Values.oidc.enabled }}
        # OIDC client credentials
        - name: oidc-credentials
          secret:
            secretName: {{ required "oidc.existingSecret is required when oidc.enabled is true" .Values.oidc.existingSecret }}
            items:
              - key: client.id
                path: client.id
              - key: client.secret
                path: client.secret
        {{- end }}

        {{- if .Values.webPassword.existingSecret }}
        # Web UI password
        - name: web-passwd
          secret:
            secretName: {{ .Values.webPassword.existingSecret }}
            items:
              - key: {{ .Values.webPassword.key | default "server-web-passwd" }}
                path: {{ .Values.webPassword.key | default "server-web-passwd" }}
                mode: 0600
        {{- end }}

        {{- if .Values.xrootd.extraConfig }}
        # Custom XRootD configuration
        - name: xrootd-config
          configMap:
            name: {{ include "pelican-cache.fullname" . }}-xrootd
            items:
              - key: xrootd.conf
                path: xrootd.conf
                mode: 0644
        {{- end }}

        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
