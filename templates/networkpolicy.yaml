{{- if and .Values.networkPolicy.enabled (not .Values.hostNetwork) }}
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ include "pelican-cache.fullname" . }}
  labels:
    {{- include "pelican-cache.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pelican-cache.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      ports:
        - protocol: TCP
          port: {{ .Values.server.cachePort }}
        - protocol: TCP
          port: {{ .Values.server.webPort }}
  egress:
    - {}
{{- end }}
