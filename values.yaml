# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Number of replicas (typically 1 for a cache)
replicaCount: 1

# -- (Required) External FQDN of the cache server
serverHostname: ""

# -- (Required) Site name reported to the federation
sitename: ""

# -- Federation configuration
federation:
  # -- Discovery URL for the federation (OSDF default)
  discoveryUrl: "https://osg-htc.org"
  # -- Federation label applied to all resources (e.g. "osdf")
  label: "osdf"

# -- Cache container image
image:
  repository: hub.opensciencegrid.org/pelican_platform/osdf-cache
  tag: ""
  pullPolicy: IfNotPresent

# -- Logrotate sidecar configuration
logrotate:
  image:
    repository: hub.opensciencegrid.org/opensciencegrid/logrotate
    tag: "24-release"
  resources:
    requests:
      cpu: "1"
      memory: "500M"
    limits:
      cpu: "2"
      memory: "2G"
  size: 500M
  rotate: 10

# -- CVMFS port redirector sidecar
cvmfsRedirector:
  # -- Enable the CVMFS port redirector container
  enabled: false
  image:
    repository: hub.opensciencegrid.org/pelican_platform/port-redirector
    tag: latest
  resources:
    requests:
      memory: "1Gi"
      cpu: "1"

# -- Cache data storage configuration
# -- You must choose between "pvc" and "hostPath" to determine where to
# -- persist, and then configure the details in the appropriate subsections.
cache:
  # -- Storage type: "pvc" or "hostPath"
  type: pvc
  # -- Host path configuration when type is "hostPath"
  hostPath:
    # -- Host path (e.g. /srv/pelican-cache/)
    path: ""
  # -- PVC configuration when type is "pvc"
  pvc:
    # -- Name of an existing PVC to use (if set, storageClass and size are ignored)
    existingClaim: ""
    # -- Storage class name for creating a new PVC
    storageClass: ""
    # -- PVC size when creating a new PVC
    size: 1000Gi
  # -- Number of blocks to prefetch (e.g. 10)
  blocksToPrefetch: ""
  # -- Maximum concurrent requests (e.g. 240)
  concurrency: ""
  # -- High water mark for cache eviction (e.g. "27000g")
  highWaterMark: ""
  # -- Low water mark for cache eviction (e.g. "25000g")
  lowWaterMark: ""
  # -- diskusage max file tracking size (e.g. "17500g")
  filesMaxSize: ""
  # -- diskusage nominal file tracking size (e.g. "17000g")
  filesNominalSize: ""
  # -- diskusage base file tracking size (e.g. "16500g")
  filesBaseSize: ""

# -- Issuer key configuration
issuerKey:
  # -- Key source type: "pvc" (auto-generated by Pelican) or "existingSecret"
  type: pvc
  pvc:
    # -- Storage class for the issuer key PVC
    storageClass: ""
    # -- PVC size
    size: 10Mi
  # -- Name of an existing Secret containing the issuer key (when type is "existingSecret")
  existingSecret: ""
  # -- Key within the Secret that contains the issuer key file
  secretKey: "private-key.pem"

# -- TLS certificate configuration (via cert-manager)
certificate:
  # -- Create a cert-manager Certificate resource
  enabled: true
  issuerRef:
    # -- Name of the ClusterIssuer or Issuer
    name: letsencrypt-prod
    # -- Kind: ClusterIssuer or Issuer
    kind: ClusterIssuer
  # -- Additional DNS Subject Alternative Names for the certificate (serverHostname is always included)
  dnsNames: []

# -- Use an existing TLS Secret instead of cert-manager
tls:
  existingSecret: ""

# -- Service configuration
service:
  type: LoadBalancer
  # -- Request a specific load balancer IP
  loadBalancerIP: ""
  externalTrafficPolicy: Local
  # -- Extra annotations (e.g. external-dns, metallb)
  annotations: {}

# -- Container resource requests and limits
resources:
  cache:
    requests:
      cpu: "1000m"
      memory: "16Gi"
    limits: {}

# -- Logging configuration
logging:
  persistence:
    # -- Provision a dedicated PVC for the /var/log/pelican volume.
    # -- When false, the data volume is also mounted at /var/log.
    # -- This supports deployments that write logs to /var/log/pelican
    # -- on the cache disk (e.g. via extraPelicanConfig.Logging.LogLocation).
    # -- Logrotate always runs.
    separateVolume: true
    # -- Name of an existing PVC to use for logs (if set, storageClass and size are ignored)
    existingClaim: ""
    # -- Storage class for creating a new logging PVC
    storageClass: ""
    # -- Logging PVC size when creating a new PVC
    size: 50Gi
  # -- Global log level
  level: INFO
  # -- Per-subsystem cache log levels
  cache: {}
  #   Pss: debug
  #   Pfc: debug
  #   PssSetOpt: debug
  #   Scitokens: warn
  #   Http: warn
  #   Xrd: warn

# -- Lotman (lot-based storage management)
lotman:
  enabled: false
  pvc:
    # -- Name of an existing PVC to use for lotman data (if set, storageClass and size are ignored)
    existingClaim: ""
    # -- Storage class for creating a new lotman PVC
    storageClass: ""
    # -- Lotman PVC size when creating a new PVC
    size: 10Gi

# -- OIDC authentication
oidc:
  # -- Enable OIDC for the cache
  enabled: false
  # -- Name of an existing Secret with keys "client.id" and "client.secret"
  existingSecret: ""

# -- List of CILogon admin user identities for the web UI
adminUsers: []
#   - "http://cilogon.org/serverA/users/12345"

# -- Name of an existing Secret containing the web UI password file
webPasswordSecret: ""
# -- Key within the web password Secret
webPasswordSecretKey: "server-web-passwd"

# -- XRootD configuration
xrootd:
  # -- Raw xrootd.conf content (creates a ConfigMap and mounts it)
  extraConfig: ""

# -- Network policy
networkPolicy:
  enabled: true

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Additional pod annotations
podAnnotations: {}

# -- Pod-level security context (fsGroup, runAsUser, etc.)
podSecurityContext: {}
#   fsGroup: 10940
#   fsGroupChangePolicy: OnRootMismatch

# -- Security context for the pelican-cache container
securityContext: {}
#   capabilities:
#     add: ["SYS_PTRACE"]

# -- Extra environment variables for the pelican-cache container
extraEnv: []
#   - name: XRD_CURLDISABLEX509
#     value: "1"

# -- Extra volumes to add to the pod
extraVolumes: []

# -- Extra volume mounts for the pelican-cache container
extraVolumeMounts: []

# -- Additional Pelican configuration (YAML map) merged into instance config
# Keys here are top-level Pelican config keys; they appear after all
# chart-managed settings so they can override them.
extraPelicanConfig: {}

