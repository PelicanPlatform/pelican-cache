# -- (Required) External FQDN of the cache server
serverHostname: ""
# -- (Required) Site name reported to the federation
sitename: ""

# -- Federation configuration
federation:
  # -- Discovery URL for the federation (OSDF default)
  discoveryUrl: "https://osg-htc.org"

# -- Cache data storage and deployment configuration
# -- You must choose between "pvc" and "hostPath" to determine where to
# -- persist, and then configure the details in the appropriate subsections.
cache:
  # -- Storage type: "pvc" or "hostPath"
  type: pvc
  # -- Host path configuration when type is "hostPath"
  hostPath:
    # -- Host path (e.g. /srv/pelican-cache/); this must be specified.
    path: ""
  # -- PVC configuration when type is "pvc"
  pvc:
    # -- Name of an existing PVC to use for cache data; if not set, will create
    # -- a new PVC using the storageClass and size parameters below.
    existingClaim: ""
    # -- Storage class name for creating a new PVC; this must be specified
    # -- unless you are using existingClaim.
    storageClass: ""
    # -- PVC size when creating a new PVC; this must be specified
    # -- unless you are using existingClaim.
    size: 1000Gi
  # -- Cache container image
  image:
    repository: hub.opensciencegrid.org/pelican_platform/cache
    tag: ""
    pullPolicy: IfNotPresent
  # -- Resource request for cache
  resources:
    requests:
      cpu: "1000m"
      memory: "16Gi"
    limits: {}

# -- Pelican cache runtime tuning parameters.
# -- These control application-level behavior (eviction, prefetch, concurrency).
# -- All values default to empty string, which omits the setting from the config
# -- and lets Pelican use its built-in defaults.
cacheConfig:
  # -- Number of blocks to prefetch (e.g. 10)
  blocksToPrefetch: ""
  # -- Maximum concurrent requests (e.g. 240; guidance: 10x core count)
  concurrency: ""
  # -- High water mark for cache eviction (e.g. "27000g" or "95")
  highWaterMark: ""
  # -- Low water mark for cache eviction (e.g. "25000g" or "90")
  lowWaterMark: ""
  # -- diskusage max file tracking size (e.g. "17500g"); if specified, must be < lowWaterMark
  filesMaxSize: ""
  # -- diskusage nominal file tracking size (e.g. "17000g")
  filesNominalSize: ""
  # -- diskusage base file tracking size (e.g. "16500g")
  filesBaseSize: ""

# -- Issuer key configuration
issuerKey:
  # -- Required: Name of an existing Secret containing the issuer key
  existingSecret: ""
  # -- Key within the Secret that contains the issuer key file
  secretKey: "private-key.pem"

tls:
  certManager:
    # -- Create a cert-manager Certificate resource.  If true, you must fill
    # -- out the issuerRef section and leave existingSecret blank.
    enabled: true
    issuerRef:
      # -- Name of the ClusterIssuer or Issuer
      name: letsencrypt-prod
      # -- Kind: ClusterIssuer or Issuer
      kind: ClusterIssuer
    # -- Additional DNS Subject Alternative Names for the certificate (serverHostname is always included)
    dnsNames: []
  # -- Use an existing TLS Secret instead of cert-manager;
  # -- if this is set, tls.certManager.enabled must be false.
  existingSecret: ""

# -- Logging configuration
logging:
  persistence:
    # -- Provision a dedicated PVC for the /var/log/pelican volume.
    # -- When false, the data volume is also mounted at /var/log.
    # -- This supports deployments that write logs to /var/log/pelican
    # -- on the cache disk (e.g. via extraPelicanConfig.Logging.LogLocation).
    # -- Logrotate always runs.
    separateVolume: true
    # -- Name of an existing PVC to use for logs; if not set, will create
    # -- a new PVC using the storageClass and size parameters below.
    existingClaim: ""
    # -- Storage class for creating a new logging PVC; this must be specified
    # -- unless you are using existingClaim.
    storageClass: ""
    # -- Logging PVC size when creating a new PVC; this must be specified
    # -- unless you are using existingClaim.
    size: 50Gi

# -- Logrotate sidecar configuration
logrotate:
  image:
    repository: hub.opensciencegrid.org/opensciencegrid/logrotate
    tag: "24-release"
  resources:
    requests:
      cpu: "1"
      memory: "500M"
    limits:
      cpu: "2"
      memory: "2G"

# -- Pelican logging and logrotate runtime settings.
loggingConfig:
  # -- Global Pelican log level
  level: INFO
  # -- Per-subsystem cache log levels
  cache: {}
  #   Pss: debug
  #   Pfc: debug
  #   PssSetOpt: debug
  #   Scitokens: warn
  #   Http: warn
  #   Xrd: warn
  # -- Log file size threshold that triggers rotation
  rotateSize: 500M
  # -- Number of rotated log files to keep
  rotateCount: 10

# -- Lotman (lot-based storage management)
lotman:
  # -- Enable lotman for the cache.  You must fill out the pvc section below
  # -- if this is true.
  enabled: false
  pvc:
    # -- Name of an existing PVC to use for lotman data; if not set, will create
    # -- a new PVC using the storageClass and size parameters below.
    existingClaim: ""
    # -- Storage class for creating a new lotman PVC; this must be specified
    # -- unless you are using existingClaim.
    storageClass: ""
    # -- Lotman PVC size when creating a new PVC; this must be specified
    # -- unless you are using existingClaim.
    size: 10Gi

# -- OIDC authentication
oidc:
  # -- Enable OIDC for the cache.  You must specify existingSecret if this is true.
  enabled: false
  # -- Name of an existing Secret with keys "client.id" and "client.secret"
  existingSecret: ""
  # -- List of CILogon admin user identities for the web UI.
  # -- Either this or adminGroups (or both) must be nonempty when enabled is true.
  adminUsers: []
  #   - "http://cilogon.org/serverA/users/12345"
  # -- List of CILogon admin group names for the web UI.
  # -- Either this or adminUsers (or both) must be nonempty when enabled is true.
  adminGroups: []
  #   - "osg-ops"

webPassword:
  # -- Required: Name of an existing Secret containing the web UI password file
  existingSecret: ""
  # -- Key within the web password Secret
  key: "server-web-passwd"

# -- Use host networking for the pod
hostNetwork: false

# -- Network policy
networkPolicy:
  enabled: true

# -- Server process settings
server:
  # -- Cache service port
  cachePort: 8443
  # -- Web UI HTTPS port
  webPort: 443

# -- Service configuration
service:
  type: LoadBalancer
  # -- Request a specific load balancer IP
  loadBalancerIP: ""
  externalTrafficPolicy: Local
  # -- Extra annotations (e.g. external-dns, metallb)
  annotations: {}

# -- XRootD configuration
xrootd:
  # -- Raw xrootd.conf content (creates a ConfigMap and mounts it)
  extraConfig: ""

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Additional pod annotations
podAnnotations: {}

# -- Pod-level security context (fsGroup, runAsUser, etc.)
podSecurityContext: {}
#   fsGroup: 10940
#   fsGroupChangePolicy: OnRootMismatch

# -- Security context for the pelican-cache container
securityContext: {}
#   capabilities:
#     add: ["SYS_PTRACE"]

# -- Extra environment variables for the pelican-cache container
extraEnv: []

# -- Extra volumes to add to the pod
extraVolumes: []

# -- Extra volume mounts for the pelican-cache container
extraVolumeMounts: []

# -- Additional Pelican configuration (YAML map) merged into instance config
# Keys here are top-level Pelican config keys; they appear after all
# chart-managed settings so they can override them.
extraPelicanConfig: {}

# -- Debugging: set this to true to sleep instead of starting the cache
sleep: false

# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""
