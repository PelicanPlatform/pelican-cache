name: Helm CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint (minimal values)
        run: helm lint . --set serverHostname=test.example.com

      - name: Lint (uw-osdf-cache)
        run: helm lint . -f ci/uw-osdf-cache-values.yaml

  template:
    name: "Template: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            args: >-
              --set serverHostname=test.example.com
              --set sitename=TEST_EXAMPLE_COM_CACHE
              --set cache.pvc.storageClass=fast-nvme
              --set logging.persistence.storageClass=standard
              --set database.persistence.storageClass=standard
              --set issuerKey.existingSecret=my-issuer-key-secret
              --set webPassword.existingSecret=my-web-passwd-secret
          - name: uw-osdf-cache
            args: "-f ci/uw-osdf-cache-values.yaml"
          - name: itb-osdf-pelican-cache
            args: "-f ci/itb-osdf-pelican-cache-values.yaml"
          - name: houston2-i2-pelican-cache
            args: "-f ci/houston2-i2-pelican-cache-values.yaml"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm template
        run: helm template test-release . ${{ matrix.args }}

  required-values:
    name: Required values validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Fail without serverHostname
        run: |
          if helm template test-release . 2>/dev/null; then
            echo "::error::Expected helm template to fail without serverHostname"
            exit 1
          else
            echo "Correctly failed when serverHostname is not set"
          fi
