name: Publish Helm Chart

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: hub.opensciencegrid.org
  REPOSITORY: pelican_platform

jobs:
  publish:
    name: Package & Push
    runs-on: ubuntu-latest
    # Gate on CI passing (the ci.yaml workflow jobs)
    needs: []
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Determine chart version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Strip leading 'v' from tag (v1.2.3 → 1.2.3)
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Dev build from main: use Chart.yaml version with -dev+sha suffix
            BASE=$(grep '^version:' Chart.yaml | awk '{print $2}')
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            VERSION="${BASE}-dev+${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${VERSION}"

      - name: Set chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" Chart.yaml
          echo "Updated Chart.yaml:"
          head -8 Chart.yaml

      - name: Lint chart
        run: helm lint . --set serverHostname=test.example.com

      - name: Package chart
        run: helm package .

      - name: Log in to OCI registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            helm registry login "${{ env.REGISTRY }}" \
              --username "${{ secrets.REGISTRY_USERNAME }}" \
              --password-stdin

      - name: Push chart
        run: |
          helm push pelican-cache-${{ steps.version.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ env.REPOSITORY }}
